<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badhoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2B2D8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B61;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle for premium feel -->
  <circle cx="30" cy="30" r="25" fill="url(#badhoGradient)" opacity="0.1"/>
  
  <!-- BadhoSa Text -->
  <text 
    x="20" 
    y="38" 
    font-family="Inter, system-ui, sans-serif" 
    font-size="32" 
    font-weight="700" 
    letter-spacing="-0.5"
    fill="url(#badhoGradient)"
    filter="url(#shadow)"
  >
    BadhoSa
  </text>
  
  <!-- Subtle highlight overlay for first two letters -->
  <text 
    x="20" 
    y="38" 
    font-family="Inter, system-ui, sans-serif" 
    font-size="32" 
    font-weight="700" 
    letter-spacing="-0.5"
    fill="url(#badhoGradient)"
    opacity="0.3"
    filter="url(#glow)"
  >
    Ba
  </text>
  
  <!-- Decorative accent line -->
  <line x1="20" y1="45" x2="140" y2="45" stroke="url(#badhoGradient)" stroke-width="1" opacity="0.3"/>
</svg>
